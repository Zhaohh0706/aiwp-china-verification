name: monthly-leaderboard
# 每月一期能源大省检验榜。月初跑，取到上月最后一天为止。
#
# 取数是配额受限的：Open-Meteo 的存档接口每小时只放行几个站点，跑不完的站点会在
# 下一次运行时接着取（已取到的有缓存，会跳过）。所以这个工作流即使半途被配额挡住
# 也不算失败——它会提交已经取到的部分，下一次继续。
on:
  schedule:
    - cron: "0 2 3 * *"     # 每月 3 日 02:00 UTC，留两天给上月数据补齐
  workflow_dispatch:
    inputs:
      end:
        description: "数据截止日期 YYYY-MM-DD，留空则取上月最后一天"
        required: false
        type: string
concurrency: { group: leaderboard, cancel-in-progress: false }
permissions: { contents: write }

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    timeout-minutes: 300        # 取数受每小时配额限制，慢是常态
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.13" }
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: 取上月数据
        id: fetch
        continue-on-error: true      # 配额挡住不算失败，下个月接着取
        run: |
          set -o pipefail
          END="${{ inputs.end }}"
          [ -n "$END" ] || END=$(date -d "$(date +%Y-%m-01) -1 day" +%Y-%m-%d)
          echo "end=$END" >> "$GITHUB_OUTPUT"
          make energy END="$END" 2>&1 | tail -40

      - name: 重出榜单
        run: make leaderboard

      - run: python -m pytest tests -q

      - name: 提交
        run: |
          set -euo pipefail
          git config user.name "Haohang Zhao"
          git config user.email "70002628+Zhaohh0706@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then
            echo "没有变化，不提交"
          else
            git commit -m "能源大省检验榜 $(date -u +%Y-%m)：数据截至 ${{ steps.fetch.outputs.end }}"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi

      - name: 失败时开 issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/report_failure.sh
