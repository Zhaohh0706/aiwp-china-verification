[project]
name = "aiwp"
version = "0.1.0"
description = "Lead-controlled verification of global NWP and AI weather models at Chinese stations"
requires-python = ">=3.11"
authors = [{ name = "Haohang Zhao" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",      # the forecast-observation pairs are stored as parquet
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Reading NOAA's machine-learned-model archive.  It is a kerchunk index over
# NetCDF, so the whole archive opens as one array and a station costs one chunk
# rather than one file.  Optional because nothing else in the package needs it.
mlwp = ["xarray>=2024.1", "zarr>=2.16,<3", "kerchunk>=0.2", "fsspec>=2024.2",
        "s3fs>=2024.2", "fastparquet>=2024.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
