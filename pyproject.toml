[project]
name = "aiwp"
version = "0.1.0"
description = "Lead-controlled verification of global NWP and AI weather models at Chinese stations"
requires-python = ">=3.11"
authors = [{ name = "Haohang Zhao" }]
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=12",      # the forecast-observation pairs are stored as parquet
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
