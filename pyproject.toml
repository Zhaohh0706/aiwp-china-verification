[project]
name = "aiwp"
version = "0.1.0"
description = "Lead-controlled verification of global NWP and AI weather models at Chinese stations"
requires-python = ">=3.11"
authors = [{ name = "Haohang Zhao" }]
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
